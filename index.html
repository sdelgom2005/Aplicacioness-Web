<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aplicaciones Web · Tema 4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef2f7;
      --panel: #ffffff;
      --ink: #1b2a41;
      --muted: #5b6b82;
      --line: #d5deea;
      --accent: #2f6fed;
      --folder: #f2b84b;
      --folder-back: #e0a02f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121a28;
        --panel: #1a2538;
        --ink: #e8eef8;
        --muted: #9aabc4;
        --line: #2b3a54;
        --accent: #6f9bff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 64px 20px 48px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .author {
      margin: 12px 0 0;
      color: var(--muted);
      font-weight: 500;
    }
    .intro {
      margin: 28px 0 20px;
      font-size: 1.05rem;
      color: var(--muted);
    }
    ul.practicas {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 14px;
    }
    a.practica {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s;
    }
    a.practica:hover { border-color: var(--accent); transform: translateX(4px); }
    a.practica:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .carpeta { flex: none; width: 52px; height: 42px; }
    .texto { flex: 1; min-width: 0; }
    .texto strong { display: block; font-size: 1.15rem; font-weight: 700; }
    .texto span { color: var(--muted); font-size: 0.95rem; }
    .abrir {
      flex: none;
      font-weight: 700;
      color: var(--accent);
      font-size: 0.95rem;
    }
    @media (max-width: 480px) {
      .abrir { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      a.practica { transition: none; }
      a.practica:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Trabajos del Tema 4</h1>
    <p class="author">Saúl Delgado Gómez · 2.º SMR</p>

    <p class="intro">Elige una práctica para abrirla en una página nueva.</p>

    <ul class="practicas">
      <!-- Cambia ARCHIVO.html por el nombre real del archivo de cada carpeta -->
      <li>
        <a class="practica" href="Ejercicio 1/index.html">
          <svg class="carpeta" viewBox="0 0 52 42" aria-hidden="true">
            <path d="M2 6a4 4 0 0 1 4-4h14l6 6h20a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z" fill="var(--folder-back)"/>
            <path d="M2 14a4 4 0 0 1 4-4h40a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z" fill="var(--folder)"/>
          </svg>
          <div class="texto">
            <strong>Ejercicio 1</strong>
            <span>Práctica 1</span>
          </div>
          <span class="abrir">Abrir</span>
        </a>
      </li>

      <li>
        <a class="practica" href="Ejercicio 2/index.html">
          <svg class="carpeta" viewBox="0 0 52 42" aria-hidden="true">
            <path d="M2 6a4 4 0 0 1 4-4h14l6 6h20a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z" fill="var(--folder-back)"/>
            <path d="M2 14a4 4 0 0 1 4-4h40a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z" fill="var(--folder)"/>
          </svg>
          <div class="texto">
            <strong>Ejercicio 2</strong>
            <span>Práctica 2: listas, div, class e id</span>
          </div>
          <span class="abrir">Abrir</span>
        </a>
      </li>

      <li>
        <a class="practica" href="empezar/index.html">
          <svg class="carpeta" viewBox="0 0 52 42" aria-hidden="true">
            <path d="M2 6a4 4 0 0 1 4-4h14l6 6h20a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z" fill="var(--folder-back)"/>
            <path d="M2 14a4 4 0 0 1 4-4h40a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z" fill="var(--folder)"/>
          </svg>
          <div class="texto">
            <strong>Empezar</strong>
            <span>Ejercicio de práctica</span>
          </div>
          <span class="abrir">Abrir</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
